# Optional Postgres for local or hosts that do not already have a database.
# Coolify: leave this file unused and set DATABASE_URL instead.
#
# docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-german}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:?}
      POSTGRES_DB: german
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d german"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    environment:
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES:-german}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/german
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
