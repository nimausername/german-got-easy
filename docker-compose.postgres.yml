# Optional Postgres + published ports for a laptop.
# Coolify: do not use this file. Set DATABASE_URL on docker-compose.yml instead.
#
#   export SERVICE_PASSWORD_64_POSTGRES=choose-a-long-password
#   export KEYCLOAK_URL=https://auth.example.com
#   export KEYCLOAK_BACKEND_CLIENT_SECRET=your-client-secret
#   export CORS_ORIGIN=http://localhost:3000
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
#
# Web: http://localhost:3000  API: http://localhost:4000/health

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-german}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:?}
      POSTGRES_DB: german
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d german"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES:-german}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/german
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    ports:
      - "3000:3000"

volumes:
  postgres-data:
