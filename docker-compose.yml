# This stack runs the learning app only: Postgres, API, and web.
# Keycloak is not included. Host it yourself and pass KEYCLOAK_URL + client secret.
# See docs/keycloak.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: german
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d german"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      SERVICE_URL_BACKEND_4000: /
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      PRODUCT_NAME: ${PRODUCT_NAME:-German Got Easy}
      DATABASE_URL: ${DATABASE_URL:-postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/german}
      KEYCLOAK_URL: ${KEYCLOAK_URL:?}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-german}
      KEYCLOAK_BACKEND_CLIENT_ID: ${KEYCLOAK_BACKEND_CLIENT_ID:-german-backend}
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET:?}
      KEYCLOAK_BOOTSTRAP: ${KEYCLOAK_BOOTSTRAP:-false}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-${SERVICE_URL_FRONTEND_3000}}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      RUN_SEED: ${RUN_SEED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 120s
    expose:
      - "4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PRODUCT_NAME: ${PRODUCT_NAME:-German Got Easy}
    restart: unless-stopped
    environment:
      SERVICE_URL_FRONTEND_3000: /
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_URL: ${SERVICE_URL_BACKEND_4000}
      NEXT_PUBLIC_API_URL: ${SERVICE_URL_BACKEND_4000}
      NEXT_PUBLIC_PRODUCT_NAME: ${PRODUCT_NAME:-German Got Easy}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    expose:
      - "3000"

volumes:
  postgres-data:
