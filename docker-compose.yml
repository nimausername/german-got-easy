# Learning app: Fastify API + Next.js web.
# You host Postgres and Keycloak. Required env:
#   DATABASE_URL, KEYCLOAK_URL, KEYCLOAK_BACKEND_CLIENT_SECRET, CORS_ORIGIN
# CORS_ORIGIN is the public web origin (https://app.example.com), no trailing slash.
# The browser talks only to the frontend. Next.js proxies /v1 to http://backend:4000.
# Optional laptop Postgres: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
# Docs: docs/coolify.md, docs/keycloak.md

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      SERVICE_URL_BACKEND_4000: /
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      PRODUCT_NAME: ${PRODUCT_NAME:-German Got Easy}
      DATABASE_URL: ${DATABASE_URL:?}
      KEYCLOAK_URL: ${KEYCLOAK_URL:?}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-german}
      KEYCLOAK_BACKEND_CLIENT_ID: ${KEYCLOAK_BACKEND_CLIENT_ID:-german-backend}
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET:?}
      KEYCLOAK_BOOTSTRAP: ${KEYCLOAK_BOOTSTRAP:-false}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:?}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      RUN_SEED: ${RUN_SEED:-true}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 300s
    expose:
      - "4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PRODUCT_NAME: ${PRODUCT_NAME:-German Got Easy}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SERVICE_URL_FRONTEND_3000: /
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_INTERNAL_URL: http://backend:4000
      NEXT_PUBLIC_PRODUCT_NAME: ${PRODUCT_NAME:-German Got Easy}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    expose:
      - "3000"
